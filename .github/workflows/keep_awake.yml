name: Keep App Awake

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          # Replace the URL below with your actual Render URL if it differs
          curl -s https://project-combiner-web.onrender.com/api/health
