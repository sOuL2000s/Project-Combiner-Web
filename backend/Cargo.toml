[package]
name = "project-combiner-backend"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "fs"] }
walkdir = "2"
ignore = "0.4"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"